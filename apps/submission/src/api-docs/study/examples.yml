        defaultLanguage: 'en_ca'
        status: 'Ongoing'
        context: 'Research'
        domain:
          - 'CANCER'
        principalInvestigators:
          - 'Dr. Jane Smith, University Research Institute'
        leadOrganizations:
          - 'University Research Institute'
