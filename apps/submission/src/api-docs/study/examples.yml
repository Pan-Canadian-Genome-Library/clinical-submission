        participantCriteria: 'Ages 0-100 with diagnosed rare genetic conditions.'
        collaborators:
          - 'University Medical Center'
          - 'International Rare Disease Consortium'
        publicationLinks:
          - 'https://example-link-1.com'
          - 'https://example-link-2.com'

